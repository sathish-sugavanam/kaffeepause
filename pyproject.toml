[project]
name = "kaffeepause"
version = "0.1.0"
description = "Takes a small feature or bug fix from a Linear issue and returns a reviewed pull request."
requires-python = ">=3.14"
dependencies = [
    "celery[redis]==5.7.0",
    "claude-agent-sdk==0.2.183",
    "docker==7.1.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
exclude = ["test_*.py", "conftest.py"]

[tool.pytest.ini_options]
testpaths = ["app"]

[tool.ruff]
target-version = "py314"
src = ["."]

[tool.ruff.lint]
# E4/E7/E9 + F are ruff's defaults; I sorts imports (isort), UP modernises syntax, B catches likely bugs.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
